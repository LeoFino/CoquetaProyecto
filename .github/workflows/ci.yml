name: CI

# Cuándo corre: cada vez que alguien sube código a main
# o abre un Pull Request hacia main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    # Todos los comandos de abajo se ejecutan dentro de la carpeta frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Probar que compila (build)
        run: npm run build